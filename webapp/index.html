<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#071a10">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Yaproq go'sht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v={{v}}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
  <div id="app">
    <!-- ===== MENYU ===== -->
    <section class="view active" id="view-menu">
      <header class="hero">
        <div class="crown">♛</div>
        <h1 class="logo">Yaproq go'sht</h1>
        <p class="tagline">BURGER • COFFEE • GOOD MOOD</p>
        <div class="closed-banner hidden" id="closed-banner"></div>
      </header>
      <nav class="cats" id="cats"></nav>
      <div id="menu-list" class="menu-list">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <footer class="perks">
        <span>🍔 Yangi ingredientlar</span><span>☕ Issiq kofe</span><span>😊 Yaxshi kayfiyat</span>
      </footer>
    </section>

    <!-- ===== SAVAT ===== -->
    <section class="view" id="view-cart">
      <div class="page-head"><h2>Savat</h2><button class="link-btn" id="clear-cart">Tozalash</button></div>
      <div id="cart-list"></div>
      <div id="cart-summary" class="summary"></div>
      <button class="primary-btn hidden" id="to-checkout">Rasmiylashtirish</button>
    </section>

    <!-- ===== RASMIYLASHTIRISH ===== -->
    <section class="view" id="view-checkout">
      <div class="page-head"><h2>Buyurtma berish</h2></div>
      <form id="checkout-form" novalidate>
        <label class="field">
          <span>Qabul qiluvchi ismi</span>
          <input name="name" id="f-name" autocomplete="name" placeholder="Ismingiz" maxlength="64" required>
        </label>
        <label class="field">
          <span>Telefon raqam</span>
          <div class="phone-input">
            <span class="prefix">+998</span>
            <input name="phone" id="f-phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="90 123 45 67" maxlength="12" required>
          </div>
        </label>
        <label class="field">
          <span>Yetkazish manzili</span>
          <textarea name="address" id="f-address" rows="2" placeholder="Shahar, ko'cha, uy, xonadon, mo'ljal" maxlength="300" required></textarea>
        </label>
        <button type="button" class="ghost-btn" id="geo-btn">📍 Joriy joylashuvimni qo'shish</button>
        <label class="field">
          <span>Izoh (ixtiyoriy)</span>
          <input name="comment" id="f-comment" placeholder="Masalan: domofon 25, qo'ng'iroq qiling" maxlength="300">
        </label>

        <div class="field"><span>To'lov usuli</span></div>
        <div class="pay-options">
          <label class="pay-option">
            <input type="radio" name="payment" value="cash" checked>
            <div class="pay-body"><b>💵 Naqd</b><small>Kuryerga to'lash</small></div>
          </label>
          <label class="pay-option disabled" aria-disabled="true">
            <input type="radio" name="payment" value="card" disabled>
            <div class="pay-body"><b>💳 Karta</b><small>Click / Payme</small></div>
            <span class="soon">Tez kunda</span>
          </label>
        </div>

        <div id="checkout-summary" class="summary"></div>
        <p class="form-error hidden" id="form-error"></p>
        <button type="submit" class="primary-btn" id="submit-btn">Buyurtmani tasdiqlash</button>
      </form>
    </section>

    <!-- ===== MUVAFFAQIYAT ===== -->
    <section class="view" id="view-success">
      <div class="success">
        <div class="success-icon">✓</div>
        <h2>Buyurtma qabul qilindi!</h2>
        <p>Buyurtma ID:</p>
        <div class="code-badge" id="success-code"></div>
        <p class="muted">Holat o'zgarishi haqida botda xabar beramiz.</p>
        <button class="primary-btn" id="track-btn">Buyurtmani kuzatish</button>
        <button class="ghost-btn" data-go="menu">Menyuga qaytish</button>
      </div>
    </section>

    <!-- ===== BUYURTMALAR ===== -->
    <section class="view" id="view-orders">
      <div class="page-head"><h2>Buyurtmalarim</h2></div>
      <div id="orders-list"></div>
    </section>

    <!-- ===== BUYURTMA TAFSILOTI ===== -->
    <section class="view" id="view-order">
      <div id="order-detail"></div>
    </section>
  </div>

  <!-- Mahsulot oynasi -->
  <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" aria-hidden="true"></div>

  <!-- Pastki panel -->
  <div class="cart-bar hidden" id="cart-bar">
    <span id="cart-bar-count"></span>
    <b id="cart-bar-total"></b>
    <span class="cart-bar-go">Savat <span aria-hidden="true">→</span></span>
  </div>
  <nav class="tabbar">
    <button data-go="menu" class="active"><i>🍔</i><span>Menyu</span></button>
    <button data-go="cart"><i>🛒</i><span>Savat</span><em class="badge hidden" id="cart-badge">0</em></button>
    <button data-go="orders"><i>📦</i><span>Buyurtmalar</span></button>
  </nav>
  <div class="toast hidden" id="toast"></div>

  <script src="app.js?v={{v}}"></script>
</body>
</html>

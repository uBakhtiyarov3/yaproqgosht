<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1f14">
  <title>Yaproq go'sht — Menyu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Montserrat:wght@600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0a1f14;
      --panel: rgba(255, 255, 255, .035);
      --line: rgba(217, 181, 108, .32);
      --gold: #d9b56c;
      --gold-2: #f3dca4;
      --gold-3: #a67c34;
      --cream: #f2e9d8;
      --cream-ink: #1b2a20;
      --text: #f6f1e6;
      --muted: rgba(246, 241, 230, .62);
      --red: #ff7a66;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        radial-gradient(1100px 600px at 85% -5%, rgba(46, 120, 76, .35), transparent 60%),
        radial-gradient(900px 700px at -10% 105%, rgba(166, 124, 52, .16), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Montserrat, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .poster { max-width: 1180px; margin: 0 auto; padding: 34px 26px 30px; }

    /* ---------- sarlavha ---------- */
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-bottom: 26px; }
    .script { font-family: "Great Vibes", cursive; font-weight: 400; color: var(--text); line-height: .95; }
    .head .script { font-size: 44px; transform: rotate(-8deg); opacity: .92; }
    .brand { text-align: center; }
    .crown { width: 64px; height: 40px; margin: 0 auto 2px; display: block; }
    .logo {
      font-family: "Playfair Display", serif; font-weight: 800; font-size: clamp(46px, 8vw, 96px); line-height: 1;
      margin: 0; letter-spacing: -.5px;
      background: linear-gradient(180deg, #fbefcf 0%, var(--gold-2) 35%, var(--gold) 70%, var(--gold-3) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline { margin-top: 12px; font-weight: 600; letter-spacing: .42em; font-size: 14px; color: var(--cream); }
    .slogan { justify-self: end; text-align: right; font-weight: 700; letter-spacing: .24em; font-size: 14px; line-height: 2; color: var(--cream); }
    .slogan::after { content: ""; display: block; width: 44px; height: 2px; background: var(--gold); margin: 8px 0 0 auto; }

    /* ---------- bo'limlar ---------- */
    .section {
      position: relative; border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
      padding: 22px 24px 24px; margin-bottom: 18px; overflow: hidden;
    }
    .section.cream { background: var(--cream); color: var(--cream-ink); border-color: rgba(166, 124, 52, .45); }
    .sec-title { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; padding-right: 150px; }
    .sec-title h2 {
      margin: 0; font-weight: 900; text-transform: uppercase; font-size: clamp(26px, 4.2vw, 48px);
      letter-spacing: .01em; line-height: 1; white-space: nowrap;
    }
    .sec-title .sub { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .cream .sec-title .sub { color: rgba(27, 42, 32, .62); }
    .sec-title .rule { flex: 1; height: 1px; background: currentColor; opacity: .35; min-width: 30px; }
    .deco {
      position: absolute; right: 26px; top: 50%; transform: translateY(-50%) rotate(-10deg);
      font-size: 42px; text-align: center; width: 150px; pointer-events: none; opacity: .9;
    }
    .cream .deco { color: var(--cream-ink); }

    .items { display: grid; gap: 0; margin-right: 150px; }
    .item { padding: 0 18px; display: flex; flex-direction: column; min-width: 0; }
    .item + .item { border-left: 1px solid var(--line); }
    .item:first-child { padding-left: 0; }
    .item-name { font-weight: 800; text-transform: uppercase; font-size: 15px; line-height: 1.2; min-height: 2.4em; letter-spacing: .01em; }
    .pic {
      position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; margin: 10px 0 14px;
      background: rgba(0, 0, 0, .25) center / cover no-repeat; box-shadow: 0 14px 30px rgba(0, 0, 0, .35);
    }
    .cream .pic { box-shadow: 0 14px 28px rgba(60, 40, 10, .25); }
    .pic.empty { display: grid; place-items: center; font-size: 46px; }
    .tags { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: rgba(10, 31, 20, .82); color: var(--gold-2); }
    .off { position: absolute; top: 8px; right: 8px; background: var(--red); color: #fff; font-weight: 900; font-size: 13px; padding: 3px 9px; border-radius: 99px; }
    .prices { margin-top: auto; display: grid; gap: 2px; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .price-row .v { font-weight: 600; font-size: 15px; opacity: .85; }
    .price { font-weight: 800; font-size: 22px; letter-spacing: .01em; white-space: nowrap; }
    .price.big { font-size: 26px; }
    .price s { font-size: 13px; font-weight: 600; opacity: .55; margin-right: 6px; }
    .price .now { color: var(--gold-2); }
    .cream .price .now { color: #8a5a12; }

    /* kichik bo'limlar bir qatorda */
    .row { display: grid; gap: 18px; margin-bottom: 18px; }
    .row .section { margin-bottom: 0; }
    .row .sec-title { padding-right: 0; }
    .row .items { margin-right: 0; }
    .row .sec-title h2 { font-size: clamp(22px, 3vw, 36px); white-space: normal; overflow-wrap: anywhere; }

    /* ---------- pastki qism ---------- */
    .foot { display: grid; grid-template-columns: repeat(3, auto) 1fr; align-items: center; gap: 0; padding: 22px 6px 8px; }
    .perk { display: flex; align-items: center; gap: 14px; padding: 0 28px; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.5; }
    .perk:first-child { padding-left: 0; }
    .perk + .perk { border-left: 1px solid var(--line); }
    .perk svg { width: 50px; height: 50px; flex: none; }
    .foot .script { justify-self: end; font-size: 46px; transform: rotate(-10deg); }
    .info { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .03em; margin-top: 14px; }
    .info b { color: var(--cream); font-weight: 700; }
    .state { text-align: center; color: var(--muted); padding: 80px 10px; font-size: 17px; font-weight: 600; }

    @media (max-width: 900px) {
      .poster { padding: 22px 14px; }
      .head { grid-template-columns: 1fr; text-align: center; }
      .head .script, .slogan { display: none; }
      .deco { display: none; }
      .sec-title { padding-right: 0; flex-wrap: wrap; gap: 8px 14px; }
      .sec-title .rule { display: none; }
      .items, .row .items { margin-right: 0; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 22px 0; }
      .item { padding: 0 10px; }
      .item:nth-child(odd) { padding-left: 0; border-left: 0; }
      .row { grid-template-columns: 1fr !important; }
      .foot { grid-template-columns: 1fr; gap: 16px; justify-items: start; }
      .perk, .perk:first-child { padding: 0; border: 0 !important; }
      .foot .script { justify-self: center; }
      .price { font-size: 18px; text-align: right; } .price.big { font-size: 22px; text-align: left; }
      .price s { display: block; margin: 0; font-size: 11px; line-height: 1.1; }
      .price-row .v { font-size: 13px; }
      .tagline { letter-spacing: .22em; font-size: 11px; }
    }
    @media print {
      @page { size: A4; margin: 8mm; }
      .poster { max-width: none; padding: 0; }
      .section, .row { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="poster" id="poster"><div class="state">Menyu yuklanmoqda…</div></main>

  <script>
  (() => {
    "use strict";
    const API = ((window.YG_CONFIG && window.YG_CONFIG.api) || "").replace(/\/$/, "");
    const LANG = new URLSearchParams(location.search).get("lang") === "ru" ? "ru" : "uz";
    document.documentElement.lang = LANG;

    const T = {
      uz: {
        slogan: ["Mazali", "Tez", "Siz uchun"], loading: "Menyu yuklanmoqda…", error: "Menyuni yuklab bo'lmadi. Birozdan so'ng qayta urinamiz…",
        perks: ["Yangi<br>masalliqlar", "Issiq<br>qahva", "Yaxshi<br>kompaniya"], currency: "Narxlar so'mda",
        subs: ["Klassika yangi ta'mda", "Har biri o'zgacha", "Shunchaki ovqatdan ko'proq", "An'anaviy ta'm", "Issiq va qarsildoq", "Sevib tayyorlanadi"],
        badges: { hit: "🔥 Hit", new: "🆕 Yangi", top: "⭐ Top", spicy: "🌶 Achchiq" },
      },
      ru: {
        slogan: ["Вкусно", "Быстро", "Для тебя"], loading: "Меню загружается…", error: "Не удалось загрузить меню. Повторим попытку…",
        perks: ["Свежие<br>ингредиенты", "Горячий<br>кофе", "Хорошая<br>компания"], currency: "Цены в сумах",
        subs: ["Классика в новом вкусе", "Каждый — особенный", "Больше чем просто еда", "Традиции в лучшем вкусе", "Горячо и хрустяще", "Готовим с любовью"],
        badges: { hit: "🔥 Хит", new: "🆕 Новинка", top: "⭐ Топ", spicy: "🌶 Острое" },
      },
    }[LANG];
    const DECO = ["Hot &amp;<br>Fresh", "Crispy<br>Tasty<br>Different", "Real Taste<br>Real<br>Happiness", "Made<br>with Love", "Good Food<br>Good Mood"];

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (n) => String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const img = (p) => (!p ? "" : /^https?:/.test(p) ? p : API + "/" + p);

    const CROWN = `<svg class="crown" viewBox="0 0 64 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbefcf"/><stop offset="1" stop-color="#b98a3e"/></linearGradient></defs>
      <path d="M6 32 2 8l15 12L32 2l15 18L62 8l-4 24z" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
      <rect x="6" y="34" width="52" height="4" rx="2" fill="url(#g)"/></svg>`;
    const ICONS = [
      `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 22c0-8 8-13 18-13s18 5 18 13z"/><path d="M5 27h38M7 32c4 2 8-2 12 0s8-2 12 0 8-2 12 0"/><path d="M7 36h34a2 2 0 0 1 0 0 4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z"/><path d="M17 15h.01M24 13h.01M31 15h.01"/></svg>`,
      `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 20h28v8a12 12 0 0 1-12 12h-4A12 12 0 0 1 8 28z"/><path d="M36 23h3a5 5 0 0 1 0 10h-4M5 44h34"/><path d="M17 6c-2 3 2 5 0 8M23 5c-2 3 2 5 0 8M29 6c-2 3 2 5 0 8"/></svg>`,
      `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="17" cy="16" r="7"/><circle cx="33" cy="16" r="7"/><path d="M4 40c0-8 6-13 13-13s13 5 13 13zM30 27c1-.3 2-.4 3-.4 7 0 12 5 12 13H33"/></svg>`,
    ];

    function prices(p) {
      const one = p.variants.length === 1 && !p.variants[0].name;
      return `<div class="prices">${p.variants.map((v) => `<div class="price-row">
          ${one ? "" : `<span class="v">${esc(v.name)}</span>`}
          <span class="price${one ? " big" : ""}">${v.old_price ? `<s>${num(v.old_price)}</s><span class="now">${num(v.price)}</span>` : num(v.price)}</span>
        </div>`).join("")}</div>`;
    }

    function item(p) {
      const pct = p.discount && p.variants[0].old_price
        ? Math.round((1 - p.variants[0].price / p.variants[0].old_price) * 100) : 0;
      return `<div class="item">
        <div class="item-name">${esc(p.name)}</div>
        <div class="pic${p.image ? "" : " empty"}" ${p.image ? `style="background-image:url('${esc(img(p.image))}')"` : ""}>${p.image ? "" : "🍽"}
          ${p.badges.length ? `<div class="tags">${p.badges.map((b) => `<span class="tag">${esc(T.badges[b] || b)}</span>`).join("")}</div>` : ""}
          ${pct > 0 ? `<span class="off">−${pct}%</span>` : ""}
        </div>
        ${prices(p)}
      </div>`;
    }

    function section(c, i, opts = {}) {
      const cols = Math.min(c.products.length, opts.small ? 2 : 4);
      return `<section class="section${opts.cream ? " cream" : ""}">
        <div class="sec-title"><h2>${esc(c.name)}</h2>${opts.small ? "" : `<span class="sub">${esc(T.subs[i % T.subs.length])}</span><span class="rule"></span>`}</div>
        ${opts.small ? "" : `<div class="deco script">${DECO[i % DECO.length]}</div>`}
        <div class="items" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${c.products.map(item).join("")}</div>
      </section>`;
    }

    function render(data) {
      // 1–2 mahsulotli kategoriyalar bir qatorga yonma-yon (namunadagi Donar · Lavash · Fri kabi)
      const blocks = [];
      let small = [];
      const flush = () => { if (small.length) { blocks.push({ row: small }); small = []; } };
      data.categories.forEach((c) => {
        if (c.products.length <= 2) { small.push(c); if (small.length === 3) flush(); }
        else { flush(); blocks.push({ cat: c }); }
      });
      flush();

      let big = 0, idx = 0;
      const body = blocks.map((b) => {
        if (b.cat) { const html = section(b.cat, idx++, { cream: big % 3 === 2 }); big++; return html; }
        const weights = b.row.map((c) => c.products.length).join("fr ") + "fr";
        return `<div class="row" style="grid-template-columns:${weights}">${b.row.map((c) => section(c, idx++, { small: true })).join("")}</div>`;
      }).join("");

      const info = [data.phone && `📞 <b>${esc(data.phone)}</b>`, data.address && `📍 ${esc(data.address)}`, data.schedule && `🕐 ${esc(data.schedule)}`, T.currency]
        .filter(Boolean).join("  ·  ");

      document.getElementById("poster").innerHTML = `
        <header class="head">
          <div class="script">Good Food<br>Good Mood</div>
          <div class="brand">${CROWN}<h1 class="logo">Yaproq go'sht</h1><div class="tagline">BURGER • COFFEE • GOOD MOOD</div></div>
          <div class="slogan">${T.slogan.map(esc).join("<br>")}</div>
        </header>
        ${body || `<div class="state">—</div>`}
        <footer class="foot">
          ${T.perks.map((t, i) => `<div class="perk">${ICONS[i]}<span>${t}</span></div>`).join("")}
          <div class="script">See you<br>soon! ♡</div>
        </footer>
        <div class="info">${info}</div>`;
    }

    async function load() {
      try {
        const r = await fetch(API + "/api/public/menu?lang=" + LANG, { cache: "no-store" });
        const data = await r.json();
        if (!data.ok) throw new Error();
        render(data);
      } catch (e) {
        if (!document.querySelector(".head")) document.getElementById("poster").innerHTML = `<div class="state">${esc(T.error)}</div>`;
        setTimeout(load, 30000);
      }
    }
    document.getElementById("poster").firstElementChild.textContent = T.loading;
    load();
    setInterval(load, 5 * 60 * 1000);  // ekranda doim ochiq tursa — narxlar o'zi yangilanadi
  })();
  </script>
</body>
</html>

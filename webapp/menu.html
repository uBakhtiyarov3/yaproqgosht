<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdd">
  <title>Yaproq go'sht — Taomnoma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --paper: #f4ecdd;
      --paper-2: #efe4d0;
      --ink: #14261b;
      --ink-2: rgba(20, 38, 27, .66);
      --green: #1f4d34;
      --green-2: #2c6a48;
      --gold: #b8862f;
      --gold-soft: rgba(184, 134, 47, .16);
      --line: rgba(20, 38, 27, .14);
      --sale: #c2412d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        radial-gradient(900px 500px at 100% 0, rgba(184, 134, 47, .13), transparent 60%),
        radial-gradient(800px 600px at 0 100%, rgba(31, 77, 52, .10), transparent 60%),
        var(--paper);
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }

    /* ---------- bosh qism ---------- */
    .top { padding: 42px 0 30px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; border-bottom: 2px solid var(--ink); }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
    .title { margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 900; font-size: clamp(54px, 9vw, 118px); line-height: .9; letter-spacing: -.02em; }
    .title em { font-style: italic; font-weight: 500; color: var(--green-2); }
    .meta { text-align: right; font-size: 14px; line-height: 1.7; color: var(--ink-2); font-weight: 600; }
    .meta b { color: var(--ink); }
    .stamp {
      display: inline-grid; place-items: center; width: 124px; height: 124px; border-radius: 50%;
      border: 2px dashed var(--gold); color: var(--gold); font-weight: 800; font-size: 9.5px; letter-spacing: .08em;
      text-transform: uppercase; text-align: center; line-height: 1.35; transform: rotate(-12deg); margin-bottom: 14px;
    }
    .stamp b { display: block; font-family: Fraunces, serif; font-size: 26px; letter-spacing: 0; margin: 2px 0; }

    /* ---------- tanlov (hit / top / chegirma) ---------- */
    .featured { margin: 34px 0 10px; }
    .featured h2 { font-size: 15px; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--green); margin: 0 0 16px; }
    .feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .feat {
      position: relative; border-radius: 22px; overflow: hidden; min-height: 300px; color: #fff;
      background: var(--green) center / cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: 0 18px 40px rgba(20, 38, 27, .22);
    }
    .feat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(8, 20, 13, .9)); }
    .feat > * { position: relative; z-index: 1; }
    .feat .in { padding: 20px 22px; }
    .feat .nm { font-family: Fraunces, serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
    .feat .ds { font-size: 13px; opacity: .8; margin-top: 6px; }
    .feat .pr { margin-top: 10px; font-weight: 800; font-size: 20px; }
    .feat .pr s { opacity: .55; font-weight: 600; font-size: 14px; margin-right: 8px; }
    .feat .chips { position: absolute; top: 16px; left: 16px; z-index: 1; }

    /* ---------- kategoriyalar ---------- */
    .cats { columns: 2; column-gap: 54px; padding: 30px 0 10px; }
    .cat { break-inside: avoid; margin-bottom: 40px; }
    .cat-head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 6px; }
    .cat-num { font-family: Fraunces, serif; font-weight: 900; font-size: 44px; line-height: 1; color: transparent; -webkit-text-stroke: 1.4px var(--gold); }
    .cat-head h2 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.05; flex: 1; }
    .cat-count { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

    .dish { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px dashed var(--line); align-items: center; }
    .dish:last-child { border-bottom: 0; }
    .ph {
      width: 92px; height: 92px; border-radius: 50%; background: var(--paper-2) center / cover no-repeat;
      box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--gold-soft), 0 10px 22px rgba(20, 38, 27, .18);
      display: grid; place-items: center; font-size: 34px;
    }
    .row1 { display: flex; align-items: baseline; gap: 8px; }
    .dname { font-weight: 800; font-size: 17px; line-height: 1.25; }
    .dots { flex: 1; border-bottom: 2px dotted rgba(20, 38, 27, .28); transform: translateY(-4px); min-width: 16px; }
    .price { font-weight: 800; font-size: 18px; white-space: nowrap; color: var(--green); }
    .price s { color: var(--ink-2); font-weight: 600; font-size: 13px; margin-right: 6px; }
    .price.sale { color: var(--sale); }
    .desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; margin-top: 4px; }
    .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .size {
      display: inline-flex; gap: 8px; align-items: baseline; padding: 5px 11px; border-radius: 99px;
      background: rgba(255, 255, 255, .55); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink-2);
    }
    .size b { color: var(--green); font-size: 14.5px; }
    .size s { font-size: 11.5px; }
    .size.sale b { color: var(--sale); }
    .chips { display: inline-flex; gap: 5px; flex-wrap: wrap; vertical-align: middle; }
    .chip { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; padding: 3px 8px; border-radius: 99px; background: var(--gold-soft); color: #7a5512; white-space: nowrap; }
    .chip.sale { background: var(--sale); color: #fff; }
    .feat .chip { background: rgba(255, 255, 255, .92); color: var(--ink); }
    .feat .chip.sale { background: var(--sale); color: #fff; }

    /* ---------- pastki qism ---------- */
    .bottom { margin-top: 20px; background: var(--green); color: #f4ecdd; }
    .bottom .wrap { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 24px; padding-top: 30px; padding-bottom: 30px; align-items: start; }
    .bottom .brand { font-family: Fraunces, serif; font-size: 30px; font-weight: 900; line-height: 1; }
    .bottom .brand small { display: block; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 600; opacity: .7; margin-top: 8px; letter-spacing: .02em; }
    .bottom .k { font-size: 11px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #d9b56c; margin-bottom: 6px; }
    .bottom .v { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .state { text-align: center; color: var(--ink-2); padding: 120px 10px; font-size: 17px; font-weight: 600; }

    @media (max-width: 860px) {
      .wrap { padding: 0 16px; }
      .top { grid-template-columns: 1fr; padding-top: 28px; }
      .meta { text-align: left; }
      .stamp { display: none; }
      .cats { columns: 1; }
      .cat-head h2 { font-size: 26px; }
      .dish { grid-template-columns: 74px 1fr; gap: 12px; }
      .ph { width: 74px; height: 74px; }
      .feat { min-height: 240px; }
      .bottom .wrap { grid-template-columns: 1fr 1fr; }
      .bottom .brand { grid-column: 1 / -1; }
    }
    @media print {
      @page { size: A4; margin: 10mm; }
      .feat { min-height: 220px; }
    }
  </style>
</head>
<body>
  <div id="page"><div class="state">Taomnoma yuklanmoqda…</div></div>

  <script>
  (() => {
    "use strict";
    const API = ((window.YG_CONFIG && window.YG_CONFIG.api) || "").replace(/\/$/, "");
    const LANG = new URLSearchParams(location.search).get("lang") === "ru" ? "ru" : "uz";
    document.documentElement.lang = LANG;

    const T = {
      uz: {
        eyebrow: "Taomnoma", sub: "go'sht", loading: "Taomnoma yuklanmoqda…",
        error: "Taomnomani yuklab bo'lmadi. Birozdan so'ng qayta urinamiz…",
        featured: "Mehmonlarimiz tanlovi", dishes: (n) => `${n} xil taom`, currency: "Narxlar so'mda",
        updated: "Yangilangan", stamp: ["Har kuni", "yangi", "tayyorlanadi"], phone: "Telefon", address: "Manzil",
        hours: "Ish vaqti", tagline: "Mazali, tez va doim yangi", sum: "so'm",
        months: ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"],
        badges: { hit: "🔥 Hit", new: "🆕 Yangi", top: "⭐ Top", spicy: "🌶 Achchiq" },
      },
      ru: {
        eyebrow: "Меню", sub: "go'sht", loading: "Меню загружается…",
        error: "Не удалось загрузить меню. Повторим попытку…",
        featured: "Выбор наших гостей", dishes: (n) => `${n} блюд`, currency: "Цены в сумах",
        updated: "Обновлено", stamp: ["Каждый", "день", "свежее"], phone: "Телефон", address: "Адрес",
        hours: "Время работы", tagline: "Вкусно, быстро и всегда свежо", sum: "сум",
        months: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"],
        badges: { hit: "🔥 Хит", new: "🆕 Новинка", top: "⭐ Топ", spicy: "🌶 Острое" },
      },
    }[LANG];

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (n) => String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const img = (p) => (!p ? "" : /^https?:/.test(p) ? p : API + "/" + p);
    const pad = (n) => String(n).padStart(2, "0");

    const pct = (p) => {
      const v = p.variants.find((x) => x.old_price);
      return v ? Math.round((1 - v.price / v.old_price) * 100) : 0;
    };
    const chips = (p) => {
      const list = p.badges.map((b) => `<span class="chip">${esc(T.badges[b] || b)}</span>`);
      if (pct(p) > 0) list.push(`<span class="chip sale">−${pct(p)}%</span>`);
      return list.length ? `<span class="chips">${list.join("")}</span>` : "";
    };
    const one = (p) => p.variants.length === 1 && !p.variants[0].name;
    const priceTxt = (v) => (v.old_price ? `<s>${num(v.old_price)}</s>${num(v.price)}` : num(v.price));

    function dish(p) {
      const single = one(p);
      const v = p.variants[0];
      const c = chips(p);
      return `<article class="dish">
        <div class="ph" ${p.image ? `style="background-image:url('${esc(img(p.image))}')"` : ""}>${p.image ? "" : "🍽"}</div>
        <div>
          <div class="row1">
            <span class="dname">${esc(p.name)}</span>
            ${single ? `<span class="dots"></span><span class="price${v.old_price ? " sale" : ""}">${priceTxt(v)}</span>` : ""}
          </div>
          ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
          ${single ? "" : `<div class="sizes">${p.variants.map((x) =>
            `<span class="size${x.old_price ? " sale" : ""}">${esc(x.name)} ${x.old_price ? `<s>${num(x.old_price)}</s>` : ""}<b>${num(x.price)}</b></span>`).join("")}</div>`}
          ${c ? `<div style="margin-top:8px">${c}</div>` : ""}
        </div>
      </article>`;
    }

    // Admin panelda «Hit», «Top» belgisi yoki chegirma qo'yilgan taomlar tepada katta ko'rsatiladi
    function featured(cats) {
      const pick = cats.flatMap((c) => c.products)
        .filter((p) => p.badges.includes("hit") || p.badges.includes("top") || pct(p) > 0)
        .sort((a, b) => pct(b) - pct(a)).slice(0, 3);
      if (!pick.length) return "";
      return `<section class="featured"><h2>${esc(T.featured)}</h2><div class="feat-grid">${pick.map((p) => {
        const v = p.variants[0];
        return `<div class="feat" ${p.image ? `style="background-image:url('${esc(img(p.image))}')"` : ""}>
          ${chips(p)}
          <div class="in"><div class="nm">${esc(p.name)}</div>
            ${p.description ? `<div class="ds">${esc(p.description)}</div>` : ""}
            <div class="pr">${one(p) ? "" : esc(v.name) + " · "}${priceTxt(v)} ${esc(T.sum)}</div></div>
        </div>`;
      }).join("")}</div></section>`;
    }

    function render(data) {
      const d = new Date();
      const date = `${d.getDate()}-${T.months[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const total = data.categories.reduce((s, c) => s + c.products.length, 0);
      const cats = data.categories.map((c, i) => `<section class="cat">
          <div class="cat-head"><span class="cat-num">${pad(i + 1)}</span><h2>${esc(c.name)}</h2>
            <span class="cat-count">${esc(T.dishes(c.products.length))}</span></div>
          ${c.products.map(dish).join("")}
        </section>`).join("");

      document.getElementById("page").innerHTML = `
        <header class="wrap top">
          <div><div class="eyebrow">${esc(T.eyebrow)} · ${esc(T.dishes(total))}</div>
            <h1 class="title">Yaproq <em>${esc(T.sub)}</em></h1></div>
          <div class="meta">
            <div class="stamp"><span>${esc(T.stamp[0])}<b>${esc(T.stamp[1])}</b>${esc(T.stamp[2])}</span></div><br>
            ${esc(T.updated)}: <b>${esc(date)}</b><br>${esc(T.currency)}
          </div>
        </header>
        <main class="wrap">
          ${featured(data.categories)}
          <div class="cats">${cats || `<div class="state">—</div>`}</div>
        </main>
        <footer class="bottom"><div class="wrap">
          <div class="brand">Yaproq go'sht<small>${esc(T.tagline)}</small></div>
          <div>${data.phone ? `<div class="k">${esc(T.phone)}</div><div class="v">${esc(data.phone)}</div>` : ""}</div>
          <div>${data.address ? `<div class="k">${esc(T.address)}</div><div class="v">${esc(data.address)}</div>` : ""}</div>
          <div>${data.schedule ? `<div class="k">${esc(T.hours)}</div><div class="v">${esc(data.schedule)}</div>` : ""}</div>
        </div></footer>`;
    }

    async function load() {
      try {
        const r = await fetch(API + "/api/public/menu?lang=" + LANG, { cache: "no-store" });
        const data = await r.json();
        if (!data.ok) throw new Error();
        render(data);
      } catch (e) {
        if (!document.querySelector(".top")) document.getElementById("page").innerHTML = `<div class="state">${esc(T.error)}</div>`;
        setTimeout(load, 30000);
      }
    }
    document.querySelector(".state").textContent = T.loading;
    load();
    setInterval(load, 5 * 60 * 1000);  // ekranda ochiq tursa narxlar o'zi yangilanadi
  })();
  </script>
</body>
</html>
